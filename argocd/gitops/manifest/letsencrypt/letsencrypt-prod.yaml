apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: letsencrypt@rootexmachina.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - selector:
        dnsNames:
        - "auth.choreo.rootexmachina.com"
        - "console.choreo.rootexmachina.com"
        - "api.choreo.rootexmachina.com"
        - "observer.choreo.rootexmachina.com"
        - "apps.choreo.rootexmachina.com"
        - "*.apps.choreo.rootexmachina.com"
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
